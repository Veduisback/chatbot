
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Chat</title>

  <link rel="stylesheet" href="style.css">

  <!-- Anime.js -->
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="brand">AI Chat</div>

      <div id="status" class="status">
        Ready
      </div>
    </header>

    <main id="messages">

      <section id="welcome" class="welcome">
        <div class="welcome-inner">

          <div class="logo-animation">
            <span class="logo-dot"></span>
            <span class="logo-dot"></span>
            <span class="logo-dot"></span>
          </div>

          <h1>Ask anything.</h1>

          <p>
            A simple AI chatbot with streaming responses,
            multi-turn conversations, and stoppable generation.
          </p>

          <div class="demo-info">
            <span>Button lifecycle</span>
            <span>Idle → Loading → Success / Error</span>
          </div>

        </div>
      </section>

    </main>

    <div class="composer-wrap">

      <form id="chatForm" class="composer">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message AI..."
          aria-label="Message"
          autocomplete="off"
        ></textarea>

        <button
          id="sendButton"
          type="submit"
          aria-label="Send message"
          aria-live="polite"
        >

          <span class="send-content">
            <span>Send</span>
          </span>

          <span
            class="loading-content"
            aria-hidden="true"
          >
            <span class="spinner"></span>
            <span>Sending</span>
          </span>

          <span
            class="success-content"
            aria-hidden="true"
          >
            <svg
              class="success-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path d="M5 12.5L9.5 17L19 7"></path>
            </svg>

            <span>Sent</span>
          </span>

          <span
            class="error-content"
            aria-hidden="true"
          >
            <svg
              class="error-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 8v5"></path>
              <path d="M12 16h.01"></path>
            </svg>

            <span>Retry</span>
          </span>

        </button>

        <button
          id="stopButton"
          type="button"
          hidden
          aria-label="Stop generation"
        >
          Stop
        </button>

      </form>

      <div class="demo-controls">

        <button
          id="demoSuccess"
          type="button"
        >
          Test Success
        </button>

        <button
          id="demoError"
          type="button"
        >
          Test Error
        </button>

      </div>

    </div>

  </div>

  <!-- Your chatbot JavaScript -->
  <script src="app.js"></script>

</body>
</html>
