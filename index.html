<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Chat</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =====================================================
       3D BACKGROUND
       ===================================================== -->

  <canvas
    id="three-bg"
    aria-hidden="true"
  ></canvas>


  <!-- =====================================================
       APPLICATION
       ===================================================== -->

  <div class="app">

    <!-- Header -->

    <header class="header">

      <div class="brand">
        AI Chat
      </div>

      <div
        id="status"
        class="status"
        aria-live="polite"
      >
        Ready
      </div>

    </header>


    <!-- Messages -->

    <main
      id="messages"
      aria-live="polite"
      aria-label="Chat messages"
    >

      <section
        id="welcome"
        class="welcome"
      >

        <div class="welcome-inner">

          <h1>Ask anything.</h1>

          <p>
            A simple AI chatbot with streaming responses,
            multi-turn conversations, and stoppable generation.
          </p>

          <div class="demo-info">

            <span>
              Interactive AI chat
            </span>

            <span>
              Streaming · Multi-turn · Stoppable
            </span>

          </div>

        </div>

      </section>

    </main>


    <!-- =================================================
         COMPOSER
         ================================================= -->

    <div class="composer-wrap">

      <form
        id="chatForm"
        class="composer"
      >

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message AI..."
          aria-label="Message"
          autocomplete="off"
        ></textarea>


        <!-- SEND BUTTON -->

        <button
          id="sendButton"
          type="submit"
          aria-label="Send message"
          aria-live="polite"
        >

          <!-- Idle -->

          <span class="send-content">
            <span>Send</span>
          </span>


          <!-- Loading -->

          <span
            class="loading-content"
            aria-hidden="true"
          >

            <span class="spinner"></span>

            <span>
              Sending
            </span>

          </span>


          <!-- Success -->

          <span
            class="success-content"
            aria-hidden="true"
          >

            <svg
              class="success-icon"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path d="M5 12.5L9.5 17L19 7" />
            </svg>

            <span>
              Sent
            </span>

          </span>


          <!-- Error -->

          <span
            class="error-content"
            aria-hidden="true"
          >

            <svg
              class="error-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >

              <circle
                cx="12"
                cy="12"
                r="9"
              ></circle>

              <path
                d="M12 8v5"
              ></path>

              <path
                d="M12 16h.01"
              ></path>

            </svg>

            <span>
              Retry
            </span>

          </span>

        </button>


        <!-- STOP -->

        <button
          id="stopButton"
          type="button"
          hidden
          aria-label="Stop generation"
        >
          Stop
        </button>

      </form>


      <!-- Demo controls -->

      <div class="demo-controls">

        <button
          id="demoSuccess"
          type="button"
        >
          Test Success
        </button>

        <button
          id="demoError"
          type="button"
        >
          Test Error
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       THREE.JS
       ===================================================== -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- 3D background -->

  <script src="three-background.js"></script>

  <!-- Existing chatbot logic -->

  <script src="app.js"></script>

</body>
</html>
