<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AI Chat with an animated message button lifecycle"
  >

  <title>AI Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="brand">
        AI Chat
      </div>

      <div
        id="status"
        class="status"
        aria-live="polite"
      >
        Ready
      </div>
    </header>


    <!-- Messages -->
    <main
      id="messages"
      aria-live="polite"
      aria-label="Chat messages"
    >

      <section
        id="welcome"
        class="welcome"
      >

        <div class="welcome-inner">

          <h1>Ask anything.</h1>

          <p>
            A simple AI chatbot with streaming responses,
            multi-turn conversations, and stoppable generation.
          </p>

          <div class="demo-info">

            <span>
              Button lifecycle
            </span>

            <span>
              Idle → Loading → Success / Error
            </span>

          </div>

        </div>

      </section>

    </main>


    <!-- Composer -->
    <div class="composer-wrap">

      <form
        id="chatForm"
        class="composer"
      >

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message AI..."
          aria-label="Message"
          autocomplete="off"
        ></textarea>


        <!-- Animated Send Button -->
        <button
          id="sendButton"
          type="submit"
          aria-label="Send message"
        >

          <!-- Idle -->
          <span
            class="button-state send-content"
            aria-hidden="false"
          >
            <span>Send</span>
          </span>


          <!-- Loading -->
          <span
            class="button-state loading-content"
            aria-hidden="true"
          >

            <span
              class="spinner"
              aria-hidden="true"
            ></span>

            <span>Sending</span>

          </span>


          <!-- Success -->
          <span
            class="button-state success-content"
            aria-hidden="true"
          >

            <svg
              class="success-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path d="M5 12.5L9.5 17L19 7"></path>
            </svg>

            <span>Sent</span>

          </span>


          <!-- Error -->
          <span
            class="button-state error-content"
            aria-hidden="true"
          >

            <svg
              class="error-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <circle
                cx="12"
                cy="12"
                r="9"
              ></circle>

              <path d="M12 8v5"></path>

              <path d="M12 16h.01"></path>
            </svg>

            <span>Retry</span>

          </span>

        </button>


        <!-- Stop generation -->
        <button
          id="stopButton"
          type="button"
          class="stop-button"
          hidden
          aria-label="Stop generation"
        >
          Stop
        </button>

      </form>


      <!-- Demo controls -->
      <div
        class="demo-controls"
        aria-label="Animation demonstrations"
      >

        <button
          id="demoSuccess"
          type="button"
        >
          Test Success
        </button>

        <button
          id="demoError"
          type="button"
        >
          Test Error
        </button>

      </div>

    </div>

  </div>


  <!--
    Anime.js
    Using the stable 3.x browser build so it can be
    loaded directly without a bundler.
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"
  ></script>


  <!-- Your application -->
  <script src="app.js"></script>

</body>
</html>
