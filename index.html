<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="AI Chat — interactive AI assistant"
  />

  <title>AI Chat</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =====================================================
       BACKGROUND 3D OBJECT
  ====================================================== -->

  <div id="scene" aria-hidden="true">

    <div class="orbital orbital-1"></div>
    <div class="orbital orbital-2"></div>

    <div
      id="cube"
      class="cube"
    >
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face right"></div>
      <div class="face left"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>

    <div class="glow"></div>

  </div>


  <!-- =====================================================
       APP
  ====================================================== -->

  <div class="app">

    <header class="header">

      <div class="brand">
        AI Chat
      </div>

      <div
        id="status"
        class="status"
        aria-live="polite"
      >
        Ready
      </div>

    </header>


    <!-- ===================================================
         MESSAGES
    ==================================================== -->

    <main
      id="messages"
      aria-label="Conversation"
    >

      <section
        id="welcome"
        class="welcome"
      >

        <div class="welcome-inner">

          <h1>
            Ask anything.
          </h1>

          <p>
            A simple AI chatbot with streaming responses,
            multi-turn conversations, and stoppable generation.
          </p>

          <div class="demo-info">

            <span>
              Interactive 3D background
            </span>

            <span>
              Move your mouse or drag
            </span>

          </div>

        </div>

      </section>

    </main>


    <!-- ===================================================
         COMPOSER
    ==================================================== -->

    <div class="composer-wrap">

      <form
        id="chatForm"
        class="composer"
      >

        <label
          class="sr-only"
          for="messageInput"
        >
          Message AI
        </label>

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message AI..."
          aria-label="Message AI"
          autocomplete="off"
        ></textarea>


        <!-- SEND -->

        <button
          id="sendButton"
          type="submit"
          aria-label="Send message"
        >

          <span class="send-content">
            <span>Send</span>
          </span>


          <span
            class="loading-content"
            aria-hidden="true"
          >

            <span class="spinner"></span>

            <span>
              Sending
            </span>

          </span>


          <span
            class="success-content"
            aria-hidden="true"
          >

            <svg
              class="success-icon"
              viewBox="0 0 24 24"
              fill="none"
            >

              <path
                d="M5 12.5L9.5 17L19 7"
              />

            </svg>

            <span>
              Sent
            </span>

          </span>


          <span
            class="error-content"
            aria-hidden="true"
          >

            <svg
              class="error-icon"
              viewBox="0 0 24 24"
              fill="none"
            >

              <circle
                cx="12"
                cy="12"
                r="9"
              />

              <path
                d="M12 8v5"
              />

              <path
                d="M12 16h.01"
              />

            </svg>

            <span>
              Retry
            </span>

          </span>

        </button>


        <!-- STOP -->

        <button
          id="stopButton"
          type="button"
          hidden
          aria-label="Stop generation"
        >
          Stop
        </button>

      </form>


      <!-- DEMO CONTROLS -->

      <div class="demo-controls">

        <button
          id="demoSuccess"
          type="button"
        >
          Test Success
        </button>

        <button
          id="demoError"
          type="button"
        >
          Test Error
        </button>

      </div>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
