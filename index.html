<div class="composer-wrap">

  <form id="chatForm" class="composer">

```
<textarea
  id="messageInput"
  rows="1"
  placeholder="Message AI..."
  aria-label="Message"
  autocomplete="off"
></textarea>

<!--
  Main lifecycle button.

  The different content elements remain in the DOM so that
  CSS can transition between them instead of abruptly
  replacing the button contents.
-->
<button
  id="sendButton"
  type="submit"
  aria-label="Send message"
  aria-live="polite"
>

  <!-- Idle -->
  <span class="send-content">
    <span>Send</span>
  </span>

  <!-- Loading -->
  <span
    class="loading-content"
    aria-hidden="true"
  >
    <span class="spinner"></span>
    <span>Sending</span>
  </span>

  <!-- Success -->
  <span
    class="success-content"
    aria-hidden="true"
  >
    <svg
      class="success-icon"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path d="M5 12.5L9.5 17L19 7" />
    </svg>

    <span>Sent</span>
  </span>

  <!-- Error -->
  <span
    class="error-content"
    aria-hidden="true"
  >
    <svg
      class="error-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 8v5"></path>
      <path d="M12 16h.01"></path>
    </svg>

    <span>Retry</span>
  </span>

</button>

<!-- Existing stop button -->
<button
  id="stopButton"
  type="button"
  style="display: none;"
  aria-label="Stop generation"
>
  Stop
</button>
```

  </form>
