<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Chat</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="brand">
        AI Chat
      </div>

      <div id="status" class="status">
        Ready
      </div>
    </header>

    <main id="messages">

      <section id="welcome" class="welcome">
        <div class="welcome-inner">
          <h1>Ask anything.</h1>

          <p>
            A simple AI chatbot with streaming responses,
            multi-turn conversations, and stoppable generation.
          </p>
        </div>
      </section>

    </main>

    <div class="composer-wrap">

      <form id="chatForm" class="composer">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message AI..."
          aria-label="Message"
          autocomplete="off"
        ></textarea>

        <button
          id="sendButton"
          type="submit"
        >
          Send
        </button>

        <button
          id="stopButton"
          type="button"
          style="display: none;"
        >
          Stop
        </button>

      </form>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
